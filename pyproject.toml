[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcai"
version = "0.3.0"
description = "Healthcare ML risk classifier + grounded RAG QA (demonstration prototype, not a medical device)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "joblib>=1.3",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "ucimlrepo>=0.0.7",
  "faiss-cpu>=1.8",
  "sentence-transformers>=3.0",
  "google-genai>=1.0",
  "threadpoolctl>=3.2",
  "streamlit>=1.35",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]  # optional paid provider
dev = ["anthropic>=0.40", "pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-requests", "types-PyYAML"]

[project.scripts]
hcai = "hcai.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hcai = ["eval/golden.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=hcai --cov-report=term-missing:skip-covered"
markers = ["slow: slower tests (model training)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # formatter owns line length

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
files = ["src/hcai"]
